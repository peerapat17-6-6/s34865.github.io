<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - โปรไฟล์ของพีรพัฒน์</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); color: #1e293b; min-height: 100vh; }
        .navbar { background: linear-gradient(90deg, #0f172a 0%, #1e3a8a 100%); color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.2); }
        .logo { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #ffffff; text-transform: uppercase; }
        .menu-btn { font-size: 24px; cursor: pointer; background: none; border: none; color: #ffffff; padding: 5px 10px; }
        .nav-links { display: none; position: absolute; top: 100%; right: 15px; background: #0f172a; width: 230px; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .nav-links.active { display: block !important; }
        .nav-links a { color: #f8fafc; padding: 14px 20px; display: block; text-decoration: none; border-bottom: 1px solid #1e293b; transition: all 0.2s ease; font-size: 15px; }
        .nav-links a:hover { background: #2563eb; color: #ffffff; padding-left: 25px; }
        .container { padding: 25px 15px 50px 15px; max-width: 850px; margin: 0 auto; }
        
        .page { background: #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); overflow: hidden; border: 1px solid #cbd5e1; padding-bottom: 30px; animation: fadeIn 0.4s ease-out forwards; }
        .profile-hero { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #2563eb 100%); padding: 45px 20px 35px 20px; text-align: center; color: white; position: relative; }
        .profile-avatar-container { margin-bottom: 15px; display: inline-block; position: relative; }
        .profile-avatar-container::before { content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px; border-radius: 50%; background: linear-gradient(45deg, #3b82f6, #60a5fa, #d97706); z-index: 1; opacity: 0.8; filter: blur(8px); animation: pulseGlow 3s infinite alternate; }
        .profile-avatar { width: 145px; height: 145px; object-fit: cover; border-radius: 50%; border: 4px solid #ffffff; position: relative; z-index: 2; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3); }
        .hero-title { font-size: 24px; font-weight: 700; margin-top: 10px; }
        .hero-subtitle { font-size: 14px; color: #93c5fd; margin-top: 4px; }
        .content-body { padding: 30px 20px; }
        .section-title { font-size: 20px; color: #0f172a; font-weight: 700; margin-bottom: 20px; text-align: center; position: relative; }
        .section-title::after { content: ''; display: block; width: 40px; height: 4px; background: #2563eb; margin: 6px auto 0; border-radius: 2px; }
        .text-content { color: #475569; line-height: 1.7; font-size: 15px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { from { opacity: 0.4; filter: blur(6px); } to { opacity: 0.9; filter: blur(12px); } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">PORTFOLIO</div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="index.html">หน้าแรก</a>
            <a href="preface.html">คำนำ</a>
            <a href="profile.html">ประวัติส่วนตัว</a>
            <a href="education.html">การศึกษา</a>
            <a href="portfolio.html">กิจกรรมและผลงาน</a>
        </div>
    </nav>

    <div class="container">
        <div class="page">
            <div class="profile-hero">
                <div class="profile-avatar-container">
                    <img src="IMG_20260907_130228.png" alt="Profile" class="profile-avatar">
                </div>
                <h1 class="hero-title">นายพีรพัฒน์ ถาวรวัฒนเจริญ</h1>
                <p class="hero-subtitle">Student at Banbueng "Utsahakramnukroh" School</p>
            </div>
            <div class="content-body" style="text-align: center;">
                <h2 class="section-title">ยินดีต้อนรับสู่แฟ้มสะสมผลงาน</h2>
                <p class="text-content">เลือกเมนูที่มุมขวาบนเพื่อดูรายละเอียดประวัติและการทำงานของผมครับ</p>
            </div>
        </div>
    </div>

    <script>
        function toggleMenu() { document.getElementById('navLinks').classList.toggle('active'); }
    </script>
</body>
</html>
