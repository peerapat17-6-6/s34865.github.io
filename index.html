<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEERAPAT PORTFOLIO</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: #0f172a; 
            color: #f8fafc; 
            min-height: 100vh;
        }

        /* Navbar */
        .navbar { 
            background: #1e293b; 
            color: white; 
            padding: 14px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0;
            z-index: 1000; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo { 
            font-size: 16px; 
            font-weight: 800; 
            letter-spacing: 1.5px;
            color: #60a5fa;
            text-transform: uppercase;
        }
        .menu-btn { 
            font-size: 22px; 
            cursor: pointer; 
            background: none; 
            border: none; 
            color: #ffffff; 
            padding: 4px 8px;
        }

        .nav-links { 
            display: none; 
            position: absolute; 
            top: 100%; 
            right: 15px; 
            background: #1e293b; 
            width: 220px; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-links.active { display: block !important; }
        .nav-links a { 
            color: #f8fafc; 
            padding: 14px 18px; 
            display: block; 
            text-decoration: none; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            font-size: 14px;
        }
        .nav-links a:hover { background: #2563eb; }

        /* Area ที่จะใช้วาดและทำลายข้อมูล */
        .container { 
            padding: 20px 12px 40px 12px; 
            max-width: 800px; 
            margin: 0 auto; 
        }

        .page-card { 
            background: #1e293b; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeInSmooth 0.25s ease-out;
        }

        /* Profile Elements */
        .profile-hero {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            padding: 35px 15px 25px 15px;
            text-align: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }
        .avatar-ring {
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3b82f6, #d97706);
            animation: rotateRing 4s linear infinite;
        }
        .profile-avatar {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #0f172a;
            position: relative; z-index: 2;
        }

        .hero-title { font-size: 22px; font-weight: 700; color: #ffffff; }
        .hero-subtitle { font-size: 13px; color: #93c5fd; margin-top: 4px; }

        .hero-tags {
            margin-top: 12px;
            display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
        }
        .tag-pill {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 10px; border-radius: 15px;
            font-size: 11px; color: #93c5fd; font-weight: 600;
        }

        .profile-body { padding: 24px 16px; }
        .section-title { font-size: 18px; color: #f8fafc; font-weight: 700; margin-bottom: 20px; text-align: center; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
        .info-card {
            padding: 16px; border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .info-card.gold-border {
            border-color: rgba(217, 119, 6, 0.5);
            background: rgba(217, 119, 6, 0.05);
            grid-column: 1 / -1; text-align: center;
        }
        .info-label { font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 4px; }
        .info-value { font-size: 15px; font-weight: 600; color: #f1f5f9; }

        .gpax-value {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        /* Portfolio Cards */
        .sub-tab-container {
            display: flex; justify-content: center; gap: 8px; margin-bottom: 20px;
            background: #0f172a; padding: 5px; border-radius: 10px;
        }
        .sub-tab-btn {
            flex: 1; padding: 10px; border: none; background: transparent;
            color: #94a3b8; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer;
        }
        .sub-tab-btn.active { background: #2563eb; color: white; }

        .portfolio-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px; margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08); overflow: hidden;
        }
        .card-header-badge { padding: 8px 16px; font-size: 12px; font-weight: 700; color: white; }
        .badge-gold-bg { background: linear-gradient(90deg, #d97706, #b45309); }
        .badge-blue-bg { background: linear-gradient(90deg, #2563eb, #1d4ed8); }
        
        .card-content { padding: 16px; }
        .card-content h3 { font-size: 16px; color: #f8fafc; margin-bottom: 8px; }
        .card-details { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }

        .cert-frame {
            margin-top: 12px; border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1); background: #0f172a; cursor: pointer;
        }
        .cert-frame img { width: 100%; height: auto; display: block; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 2000;
            justify-content: center; align-items: center; padding: 15px;
        }
        .modal-overlay.active { display: flex !important; }
        .modal-img { max-width: 95%; max-height: 85vh; border-radius: 8px; }
        .modal-close { position: absolute; top: 15px; right: 20px; color: white; font-size: 30px; cursor: pointer; }

        @keyframes fadeInSmooth {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">PEERAPAT.PORTFOLIO</div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="javascript:void(0)" onclick="loadPage('home')">หน้าแรก (Profile)</a>
            <a href="javascript:void(0)" onclick="loadPage('portfolio')">แฟ้มสะสมผลงาน (Portfolio)</a>
            <a href="javascript:void(0)" onclick="loadPage('activities')">กิจกรรม (Activities)</a>
        </div>
    </nav>

    <!-- พื้นที่แสดงผลเดี่ยวที่จะถูกวาด/สลับข้อมูล -->
    <div class="container">
        <div id="mainContent" class="page-card">
            <!-- ข้อมูลจะถูกฉีดใส่ที่นี่ผ่าน JavaScript -->
        </div>
    </div>

    <!-- Modal ขยายรูป -->
    <div class="modal-overlay" id="imgModal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img class="modal-img" id="modalImage" src="" alt="เกียรติบัตรขนาดใหญ่">
    </div>

    <script>
        // สถานะแท็บย่อยปัจจุบันของ Portfolio
        var currentCertTab = 'compete';

        // 1. คลังเก็บ HTML Template (สร้างและลบทิ้งเมื่อสลับหน้า)
        function getPageTemplate(pageId) {
            if (pageId === 'home') {
                return `
                    <div class="profile-hero">
                        <div class="avatar-wrapper">
                            <div class="avatar-ring"></div>
                            <img src="IMG_20260907_130228.png" alt="รูปโปรไฟล์ พีรพัฒน์" class="profile-avatar">
                        </div>
                        <h1 class="hero-title">นายพีรพัฒน์ ถาวรวัฒนเจริญ</h1>
                        <p class="hero-subtitle">Student at Banbueng "Utsahakramnukroh" School</p>
                        
                        <div class="hero-tags">
                            <span class="tag-pill">💻 CSE Program</span>
                            <span class="tag-pill">⚙️ Instrumentation</span>
                            <span class="tag-pill">🤖 Automation</span>
                        </div>
                    </div>

                    <div class="profile-body">
                        <h2 class="section-title">ข้อมูลส่วนตัว (Profile)</h2>
                        <div class="info-grid">
                            <div class="info-card">
                                <div class="info-label">สถานศึกษา</div>
                                <div class="info-value">โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</div>
                            </div>
                            <div class="info-card">
                                <div class="info-label">แผนการเรียน</div>
                                <div class="info-value">CSE (Computer Science & Engineering)</div>
                            </div>
                            <div class="info-card gold-border">
                                <div class="info-label">เกรดเฉลี่ยสะสม (GPAX)</div>
                                <div><span class="gpax-value" id="gpaxCounter">0.00</span></div>
                            </div>
                        </div>
                    </div>
                `;
            } 
            else if (pageId === 'portfolio') {
                var competeTabActive = currentCertTab === 'compete' ? 'active' : '';
                var trainTabActive = currentCertTab === 'train' ? 'active' : '';

                var certsHTML = '';
                if (currentCertTab === 'compete') {
                    certsHTML = `
                        <div class="portfolio-card">
                            <div class="card-header-badge badge-gold-bg">🥇 รางวัลชนะเลิศ</div>
                            <div class="card-content">
                                <h3>การประกวดนวัตกรรมและเทคโนโลยี แก้ปัญหา Smart School</h3>
                                <p class="card-details"><strong>โครงการ:</strong> ค่ายพัฒนานวัตกรรมและเทคโนโลยี ครั้งที่ 5</p>
                                <p class="card-details"><strong>สถานที่:</strong> โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"</p>
                                <p class="card-details"><strong>วันที่:</strong> 9–11 มกราคม พ.ศ. 2569</p>
                                <div class="cert-frame" onclick="openModal('pic_20260907094652_0.jpg')">
                                    <img src="pic_20260907094652_0.jpg" alt="เกียรติบัตร Smart School">
                                </div>
                            </div>
                        </div>
                        <div class="portfolio-card">
                            <div class="card-header-badge badge-blue-bg">🏆 GOOD PERFORMANCE PRIZE</div>
                            <div class="card-content">
                                <h3>PLC BATTLE THAILAND 2025</h3>
                                <p class="card-details"><strong>หน่วยงานที่จัด:</strong> CEITA, KMUTNB ร่วมกับ Schneider Electric & TIA</p>
                                <p class="card-details"><strong>สถานที่:</strong> มจพ. วิทยาเขตปราจีนบุรี</p>
                                <p class="card-details"><strong>วันที่:</strong> 13–14 ธันวาคม 2025</p>
                                <div class="cert-frame" onclick="openModal('pic_20260907094120_0.jpg')">
                                    <img src="pic_20260907094120_0.jpg" alt="เกียรติบัตร PLC BATTLE">
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    certsHTML = `<p style="color: #94a3b8; font-size: 14px; text-align: center; padding: 40px 0;">ยังไม่มีข้อมูลเกียรติบัตรการอบรม</p>`;
                }

                return `
                    <div class="profile-body">
                        <h2 class="section-title">แฟ้มสะสมผลงาน (Portfolio)</h2>
                        <div class="sub-tab-container">
                            <button class="sub-tab-btn ${competeTabActive}" onclick="switchCertTab('compete')">🏆 เกียรติบัตรการแข่ง</button>
                            <button class="sub-tab-btn ${trainTabActive}" onclick="switchCertTab('train')">📜 เกียรติบัตรการอบรม</button>
                        </div>
                        <div id="certListArea">${certsHTML}</div>
                    </div>
                `;
            } 
            else if (pageId === 'activities') {
                return `
                    <div class="profile-body">
                        <h2 class="section-title">กิจกรรมที่เข้าร่วม (Activities)</h2>
                        <p style="color: #94a3b8; font-size: 14px; text-align: center; padding: 40px 0;">ยังไม่มีข้อมูลกิจกรรม</p>
                    </div>
                `;
            }
        }

        // 2. ฟังก์ชันเปลี่ยนหน้า (ลบของเก่าทิ้งจาก RAM ทันทีแล้ววาดเฉพาะหน้าใหม่)
        function loadPage(pageId) {
            var container = document.getElementById('mainContent');
            
            // ล้างข้อมูลใน RAM ของหน้าเดิมออกทั้งหมด
            container.innerHTML = "";
            
            // ฉีด HTML หน้าใหม่เข้าไป
            container.innerHTML = getPageTemplate(pageId);

            document.getElementById('navLinks').classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // ถ้่าเปิดหน้าแรกให้ทำงานนับเลข GPAX
            if (pageId === 'home') {
                animateGPAX();
            }
        }

        // 3. ฟังก์ชันสลับแท็บย่อยในหน้า Portfolio
        function switchCertTab(tabType) {
            currentCertTab = tabType;
            loadPage('portfolio');
        }

        // 4. ตัวนับ GPAX
        function animateGPAX() {
            var counter = document.getElementById('gpaxCounter');
            if(!counter) return;
            
            var target = 3.82;
            var duration = 600;
            var startTime = null;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                var progress = Math.min((timestamp - startTime) / duration, 1);
                counter.innerText = (progress * target).toFixed(2);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    counter.innerText = "3.82";
                }
            }
            window.requestAnimationFrame(step);
        }

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        function openModal(imgSrc) {
            var img = document.getElementById('modalImage');
            var modal = document.getElementById('imgModal');
            if(img && modal) {
                img.src = imgSrc;
                modal.classList.add('active');
            }
        }

        function closeModal() {
            var modal = document.getElementById('imgModal');
            var img = document.getElementById('modalImage');
            if(modal) {
                modal.classList.remove('active');
                setTimeout(function() { img.src = ""; }, 150);
            }
        }

        // เมื่อโหลดเว็บครั้งแรก ให้สร้างเฉพาะหน้าแรก (Home)
        window.onload = function() {
            loadPage('home');
        };
    </script>

</body>
</html>
